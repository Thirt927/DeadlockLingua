<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">DeadlockLingua — Deadlock 聊天实时翻译</title>
  <desc id="heroDesc">项目名与一句话价值：把 Deadlock 游戏内聊天实时翻译成中文，译文直接追加在原消息下方。右侧示意两件事：桥按位信道把译文送回游戏（/btipc/dl 返回 200 即记作位 1），以及游戏内的呈现效果——聊天行原文 + 下方浅蓝斜体的译文 Label。</desc>

  <defs>
    <marker id="heroArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L6 3 L0 6 z" fill="#C9A44E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="340" rx="24" fill="#0C0E12"/>
  <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="23.25" fill="none" stroke="#232A34" stroke-width="1.5"/>

  <g id="title-block">
    <text x="56" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="3" fill="#C9A44E">DEADLOCK · CHAT TRANSLATION</text>
    <text x="56" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="58" font-weight="700" fill="#F2F4F8">DeadlockLingua</text>
    <rect x="56" y="168" width="120" height="4" rx="2" fill="#C9A44E"/>
    <text x="56" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="23" fill="#DDE2EA">聊天译文，直接显示在原消息下面</text>
    <text x="56" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#8A93A3">Real-time translation, right under the original line</text>
    <text x="56" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="0.5" fill="#8A93A3">v2.1.0 · GPL-3.0 · Windows · Node.js</text>
  </g>

  <g id="project-proof">
    <rect x="700" y="56" width="444" height="42" rx="10" fill="#161A21" stroke="#232A34" stroke-width="1.5"/>
    <text x="720" y="83" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#A9B2C0">/btipc/dl?w=bd2468&amp;r=5&amp;p=42 → 200 = 位 1</text>

    <path d="M716 100 L716 128" stroke="#C9A44E" stroke-width="2.5" marker-end="url(#heroArrow)"/>

    <rect x="700" y="136" width="444" height="166" rx="12" fill="#161A21"/>
    <rect x="700" y="136" width="6" height="166" rx="3" fill="#C9A44E"/>
    <rect x="700.75" y="136.75" width="442.5" height="164.5" rx="11.25" fill="none" stroke="#3A4453" stroke-width="1.5"/>

    <rect x="722" y="158" width="28" height="28" rx="7" fill="#C9A44E"/>
    <text x="736" y="178" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0C0E12">K</text>
    <text x="760" y="179" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="600" fill="#F2F4F8">Kuro</text>
    <text x="812" y="179" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#8A93A3">[队伍]</text>

    <text x="722" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" fill="#A9B2C0">gg wp, push mid</text>

    <rect x="722" y="238" width="200" height="36" rx="4" fill="#0A1220" stroke="#5A9DC8" stroke-width="1"/>
    <text x="736" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-style="italic" fill="#8FD8FF">打得好，推中路</text>
    <text x="940" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8A93A3">译文 Label</text>
  </g>
</svg>
