<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>DeadlockLingua /tr 面板 · 标签页预览</title>
<style>
  /* 按 v2.1.0 chat.xml + lingua_chat.css 复刻的浏览器预览，不是游戏截图。 */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 1280px; height: 720px; overflow: hidden; background: #07090b;
    font-family: "Bahnschrift", "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif; }
  .stage { position: relative; width: 1280px; height: 720px;
    background: radial-gradient(900px 520px at 50% 36%, #1a2129 0%, rgba(20,26,32,.55) 42%, rgba(8,11,14,0) 72%),
                linear-gradient(180deg, #0b0f13, #06080a); }
  .panel { position: absolute; left: 340px; top: 40px; width: 600px; height: 640px;
    display: flex; flex-direction: column; color: #c6cfda;
    background: linear-gradient(180deg, #151b22 0%, #0e1318 50%, #0a0d10 100%);
    border: 1px solid rgba(201,164,78,.22); border-radius: 8px;
    box-shadow: rgba(0,0,0,.55) 0 18px 40px 0; }
  .header { height: 48px; display: flex; align-items: center; padding: 0 16px;
    background: rgba(255,255,255,.03); border-bottom: 1px solid rgba(255,255,255,.07); }
  .title { font-size: 17px; color: #f2f4f8; font-weight: 700; letter-spacing: .5px; }
  .sub { font-size: 12px; color: #8a94a3; margin-left: 8px; }
  .tabs { height: 38px; display: flex; padding: 0 10px;
    background: rgba(0,0,0,.18); border-bottom: 1px solid rgba(255,255,255,.06); }
  .tab { height: 38px; padding: 0 16px; display: flex; align-items: center;
    font-size: 12px; font-weight: 600; color: #8d97a3;
    border-bottom: 2px solid transparent; }
  .tab.active { color: #e7b96b; border-bottom-color: #c9a44e; }
  .status { height: 28px; display: flex; align-items: center; padding: 0 16px;
    background: rgba(0,0,0,.28); border-bottom: 1px solid rgba(255,255,255,.05); }
  .status .hint { flex: 1; font-size: 12px; color: #9fb4d0; }
  .status .bridge { font-size: 12px; color: #7fd8a8; white-space: nowrap; }
  .dot { color: #6b7684; font-size: 11px; margin-right: 5px; }
  .body { flex: 1; min-height: 0; display: flex; }
  .page { width: 100%; height: 100%; overflow: hidden; padding: 6px 14px 12px; }
  .section { font-size: 12px; font-weight: 600; letter-spacing: .5px; color: #93a0b0;
    padding: 10px 2px 5px; margin-bottom: 1px; border-top: 1px solid rgba(255,255,255,.06); }
  .section.first { border-top: 0; padding-top: 2px; }
  .row { width: 100%; padding: 7px 10px; margin-bottom: 4px; border-radius: 6px;
    border-left: 2px solid transparent; }
  .label { font-size: 14px; color: #c6cfda; margin-bottom: 5px; }
  .control { width: 100%; height: 30px; }
  .select { width: 100%; height: 30px; display: flex; align-items: center; justify-content: center;
    background: #1e242b; border: 1px solid rgba(255,255,255,.09); border-radius: 4px;
    color: #eef2f7; font-size: 14px; }
  .toggle { width: 76px; height: 30px; display: flex; align-items: center; justify-content: center;
    background: #1e242b; border: 1px solid rgba(255,255,255,.08); border-radius: 4px;
    color: #8fe0b4; font-size: 14px; }
  .footer { height: 56px; display: flex; align-items: center; padding: 0 16px;
    background: rgba(0,0,0,.22); border-top: 1px solid rgba(255,255,255,.07); }
  .btn { min-width: 72px; height: 30px; padding: 2px 14px; border-radius: 4px;
    color: #fff; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
  .save { background: #2f5d3a; border: 1px solid rgba(143,224,180,.35); }
  .test { background: #27435f; border: 1px solid rgba(143,200,240,.3); margin-left: 8px; }
  .spacer { flex: 1; }
  .close { width: 40px; min-width: 40px; height: 30px; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    background: #1e242b; border: 1px solid rgba(255,255,255,.08); color: #b9c2ce; font-size: 13px; }
</style>
</head>
<body>
<div class="stage">
  <div class="panel">
    <div class="header">
      <div class="title">DeadlockLingua</div>
      <div class="sub">聊天翻译设置</div>
    </div>

    <div class="tabs">
      <div class="tab active">常用</div>
      <div class="tab">服务商</div>
      <div class="tab">高级</div>
    </div>

    <div class="status">
      <div class="hint">改完点保存 · ESC 关闭</div>
      <div class="bridge"><span class="dot">●</span>桥在线</div>
    </div>

    <div class="body">
      <div class="page">
        <div class="section first">翻译</div>
        <div class="row">
          <div class="label">启用翻译</div>
          <div class="control"><div class="toggle">是</div></div>
        </div>

        <div class="section">语言与显示</div>
        <div class="row">
          <div class="label">目标语言</div>
          <div class="control"><div class="select">简体中文 (zh-Hans)</div></div>
        </div>
        <div class="row">
          <div class="label">显示模式</div>
          <div class="control"><div class="select">双语(原文 + 译文)</div></div>
        </div>

        <div class="section">发送前翻译</div>
        <div class="row">
          <div class="label">发送前翻译</div>
          <div class="control"><div class="select">仅译文</div></div>
        </div>
        <div class="row">
          <div class="label">发送目标语言</div>
          <div class="control"><div class="select">English 英语 (en)</div></div>
        </div>
      </div>
    </div>

    <div class="footer">
      <div class="btn save">保存</div>
      <div class="btn test">测试桥</div>
      <div class="spacer"></div>
      <div class="close">X</div>
    </div>
  </div>
</div>
</body>
</html>
