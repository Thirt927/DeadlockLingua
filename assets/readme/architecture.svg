<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">DeadlockLingua 工作原理 · BTIPC 双向信道</title>
  <desc id="archDesc">上行：游戏内 Panorama Mod 把翻译请求打成一行 [LCT] BTIPC REQ 结构化文本写进 console.log，本地 Node.js 桥每 0.8 秒增量 tail 读回，再调用翻译服务商。下行：桥把译文切成 16 字节帧，按位用 HTTP 状态码回答（200 记作位 1，404 记作位 0），游戏侧 128 个隐藏 Image 面板逐轮读回并校验 CRC，最后把译文作为 Label 追加到原聊天行下方。需要游戏带 -condebug 启动。</desc>

  <defs>
    <marker id="arBrass" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L5 3.5 L0 7 z" fill="#C9A44E"/>
    </marker>
    <marker id="arSteel" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L5 3.5 L0 7 z" fill="#5A6577"/>
    </marker>
    <marker id="arVerdi" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L5 3.5 L0 7 z" fill="#4E8C7A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="440" rx="24" fill="#0C0E12"/>
  <rect x="0.75" y="0.75" width="1198.5" height="438.5" rx="23.25" fill="none" stroke="#232A34" stroke-width="1.5"/>

  <text x="48" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2" fill="#C9A44E">DATA FLOW · 数据流</text>
  <text x="1152" y="56" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#4E8C7A">BTIPC · 双向 two-way</text>

  <g id="box-game">
    <rect x="60" y="104" width="200" height="112" rx="12" fill="#161A21" stroke="#232A34" stroke-width="1.5"/>
    <text x="80" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="600" fill="#F2F4F8">游戏内 Mod</text>
    <text x="80" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8A93A3">Panorama UI</text>
    <text x="80" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8A93A3">128 × Image panel</text>
  </g>

  <g id="box-log">
    <rect x="330" y="104" width="200" height="112" rx="12" fill="#161A21" stroke="#232A34" stroke-width="1.5"/>
    <text x="350" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#F2F4F8">console.log</text>
    <text x="350" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8A93A3">[LCT] BTIPC REQ</text>
    <text x="350" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8A93A3">(needs -condebug)</text>
  </g>

  <g id="box-bridge">
    <rect x="600" y="104" width="200" height="112" rx="12" fill="#161A21" stroke="#232A34" stroke-width="1.5"/>
    <text x="620" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="600" fill="#F2F4F8">本地桥 / Bridge</text>
    <text x="620" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8A93A3">127.0.0.1:8791</text>
    <text x="620" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8A93A3">/btipc/dl</text>
  </g>

  <g id="box-providers">
    <rect x="870" y="104" width="200" height="112" rx="12" fill="#161A21" stroke="#232A34" stroke-width="1.5"/>
    <text x="890" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="600" fill="#F2F4F8">翻译服务商</text>
    <text x="890" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8A93A3">Bing · Microsoft</text>
    <text x="890" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8A93A3">OpenAI · DeepL</text>
  </g>

  <path d="M260 162 H322" stroke="#C9A44E" stroke-width="2.5" marker-end="url(#arBrass)"/>
  <text x="291" y="150" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="15" fill="#C9A44E">① 上行</text>

  <path d="M530 162 H592" stroke="#5A6577" stroke-width="2" marker-end="url(#arSteel)"/>
  <text x="561" y="150" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="15" fill="#8A93A3">读日志</text>

  <path d="M800 162 H862" stroke="#4E8C7A" stroke-width="2" marker-end="url(#arVerdi)"/>
  <text x="831" y="150" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="15" fill="#4E8C7A">翻译</text>

  <path d="M700 216 V302 H160 V226" fill="none" stroke="#4E8C7A" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#arVerdi)"/>
  <text x="600" y="290" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" fill="#4E8C7A">② 下行 /btipc/dl：200 = 位 1，404 = 位 0（128 位 = 16 字节一帧，CRC + 重投）</text>

  <text x="600" y="352" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="600" fill="#F2F4F8">译文追加为原聊天行下方的 Label</text>
  <text x="600" y="380" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8A93A3">translation rendered under the chat row</text>
  <text x="1152" y="410" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#C9A44E">-condebug 必需 · required</text>
</svg>
